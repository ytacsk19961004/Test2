<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージダイアログ</title>
  <style>
    /* --- 基本設定（提示コードから統一） --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
      color: #333333;
    }

    /* --- ダイアログカード本体 --- */
    .dialog-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 440px;
      margin: 20px;
      overflow: hidden;
      animation: fadeIn 0.2s ease-in-out;
    }

    /* --- ダイアログヘッダー --- */
    .dialog-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dialog-title {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
    }

    /* --- ダイアログコンテンツ --- */
    .dialog-body {
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }

    /* --- ダイアログフッター（ボタンエリア） --- */
    .dialog-footer {
      padding: 12px 20px;
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* --- ボタン共通スタイル --- */
    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .btn:active {
      background-color: #f1f5f9;
    }

    /* プライマリボタン（決定・OK用） */
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .btn-primary:hover {
      background-color: #0369a1;
      border-color: #0369a1;
    }

    /* アニメーション */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- ダイアログ（メッセージボックス） -->
  <div class="dialog-card">
    <!-- <div class="dialog-header">
      <span class="dialog-title">エラー</span>
    </div> -->
    
    <div class="dialog-body">
        <p>
            画面に対するアクセス権限がありません。<br>
            アクセス権限のあるアカウントで、Googleにログインしてください。
        </p>
    </div>
  </div>

</body>
</html>
