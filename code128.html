<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code128 バーコード作成ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .barcode-area {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        .btn-download {
            margin-top: 1.25rem;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Code128 バーコード生成</h1>
    
    <div class="input-group">
        <label for="codeInput">文字列を入力</label>
        <input type="text" id="codeInput" placeholder="例: ABC-123456" autocomplete="off">
        <div class="hint">英数字・標準的な半角記号に対応（ASCIIコード）</div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <div class="barcode-area">
        <svg id="barcode"></svg>
    </div>

    <button id="downloadBtn" class="btn-download">PNG画像として保存</button>
</div>

<script>
    const codeInput = document.getElementById('codeInput');
    const barcodeSvg = document.getElementById('barcode');
    const errorMessage = document.getElementById('errorMessage');
    const downloadBtn = document.getElementById('downloadBtn');

    // 入力監視イベント
    codeInput.addEventListener('input', () => {
        const value = codeInput.value;
        
        // 入力初期化時
        if (value === '') {
            clearBarcode();
            return;
        }

        // 全角文字（日本語など）の判定チェック
        if (/[^\x00-\x7F]/.test(value)) {
            showError('半角英数字・半角記号のみ入力できます（全角文字不可）。');
            hideDownloadButton();
            barcodeSvg.innerHTML = '';
            return;
        }

        generateBarcode(value);
    });

    // Code128バーコード生成処理
    function generateBarcode(text) {
        try {
            JsBarcode("#barcode", text, {
                format: "CODE128",
                width: 2,
                height: 80,
                displayValue: true,
                fontSize: 18,
                margin: 10
            });
            
            hideError();
            downloadBtn.style.display = 'block';
        } catch (e) {
            showError('バーコードの生成に失敗しました。');
            hideDownloadButton();
        }
    }

    // 表示クリア・ユーティリティ関数群
    function clearBarcode() {
        barcodeSvg.innerHTML = '';
        hideError();
        hideDownloadButton();
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
    }

    function hideError() {
        errorMessage.style.display = 'none';
    }

    function hideDownloadButton() {
        downloadBtn.style.display = 'none';
    }

    // PNG画像としてダウンロード
    downloadBtn.addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(barcodeSvg);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const image = new Image();
        image.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            const context = canvas.getContext('2d');
            
            context.fillStyle = '#FFFFFF';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0);

            const png = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = png;
            // ファイル名に使えない文字をハイフンに変換
            const safeFileName = codeInput.value.replace(/[/\\?%*:|"<>]/g, '-');
            downloadLink.download = `CODE128_${safeFileName}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        };
        image.src = blobURL;
    });
</script>

</body>
</html>
