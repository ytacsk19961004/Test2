<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANコード バーコード作成ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .barcode-area {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-download {
            margin-top: 1.25rem;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JANバーコード生成</h1>
    
    <div class="input-group">
        <label for="janInput">JANコード (13桁 または 8桁)</label>
        <input type="text" id="janInput" placeholder="例: 4901234567894" maxlength="13" autocomplete="off">
        <div id="errorMessage" class="error-message"></div>
    </div>

    <div class="barcode-area">
        <svg id="barcode"></svg>
    </div>

    <button id="downloadBtn" class="btn-download">PNG画像として保存</button>
</div>

<script>
    const janInput = document.getElementById('janInput');
    const barcodeSvg = document.getElementById('barcode');
    const errorMessage = document.getElementById('errorMessage');
    const downloadBtn = document.getElementById('downloadBtn');

    // JANコード入力時のイベントハンドラ
    janInput.addEventListener('input', () => {
        const value = janInput.value.trim();
        
        // 入力初期化時
        if (value === '') {
            clearBarcode();
            return;
        }

        // 数字以外の文字を除外（自動補正）
        if (!/^\d+$/.test(value)) {
            showError('半角数字のみ入力してください。');
            return;
        }

        // 桁数チェック (EAN-13 / EAN-8)
        if (value.length === 13 || value.length === 8) {
            generateBarcode(value);
        } else {
            showError(`桁数が不十分です（現在 ${value.length} 桁 / 8桁または13桁必要）`);
            hideDownloadButton();
        }
    });

    // バーコード生成関数
    function generateBarcode(code) {
        try {
            JsBarcode("#barcode", code, {
                format: "EAN13", // EAN13設定で8桁(EAN8)も自動処理対応
                width: 2,
                height: 80,
                displayValue: true,
                fontSize: 18,
                margin: 10
            });
            
            hideError();
            downloadBtn.style.display = 'block';
        } catch (e) {
            // チェックデジジット不正などのエラー処理
            showError('無効なJANコードです（チェックデジットを確認してください）');
            hideDownloadButton();
        }
    }

    // 表示のクリア処理
    function clearBarcode() {
        barcodeSvg.innerHTML = '';
        hideError();
        hideDownloadButton();
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
        barcodeSvg.innerHTML = '';
    }

    function hideError() {
        errorMessage.style.display = 'none';
    }

    function hideDownloadButton() {
        downloadBtn.style.display = 'none';
    }

    // PNG画像としてダウンロード
    downloadBtn.addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(barcodeSvg);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const image = new Image();
        image.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            const context = canvas.getContext('2d');
            
            // 背景色を白にする
            context.fillStyle = '#FFFFFF';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0);

            const png = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = png;
            downloadLink.download = `JAN_${janInput.value}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        };
        image.src = blobURL;
    });
</script>

</body>
</html>
