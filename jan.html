<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANコード バーコード作成ツール</title>
    <!-- バーコード生成ライブラリ (JsBarcode) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .info-box {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #166534;
            text-align: left;
        }

        .info-box strong {
            color: #15803d;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .barcode-area {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-download {
            margin-top: 1.25rem;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JANバーコード生成</h1>
    
    <div class="input-group">
        <label for="janInput">JANコードを入力</label>
        <input type="text" id="janInput" placeholder="例: 490123456789 (12桁で自動計算)" maxlength="13" autocomplete="off">
        <div class="hint">12桁/7桁入力 → チェックデジットを自動計算<br>13桁/8桁入力 → そのまま生成＆正誤チェック</div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <div id="infoBox" class="info-box"></div>

    <div class="barcode-area">
        <svg id="barcode"></svg>
    </div>

    <button id="downloadBtn" class="btn-download">PNG画像として保存</button>
</div>

<script>
    const janInput = document.getElementById('janInput');
    const barcodeSvg = document.getElementById('barcode');
    const errorMessage = document.getElementById('errorMessage');
    const infoBox = document.getElementById('infoBox');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentFullCode = '';

    // チェックデジット計算（モジュラス10 ウェイト3-1）
    function calculateCheckDigit(codeWithoutCd) {
        const digits = codeWithoutCd.split('').map(Number);
        const is12Digit = digits.length === 12; // 13桁化用（12桁入力）か8桁化用（7桁入力）か
        
        let sum = 0;
        for (let i = 0; i < digits.length; i++) {
            // JAN-13(12桁入力)の場合: 右端から数えて奇数位置(配列の1, 3, 5...)に3を掛ける
            // JAN-8(7桁入力)の場合: 右端から数えて奇数位置(配列の0, 2, 4...)に3を掛ける
            const positionFromRight = digits.length - i;
            const weight = (positionFromRight % 2 === 1) ? 3 : 1;
            sum += digits[i] * weight;
        }
        
        const remainder = sum % 10;
        return (10 - remainder) % 10;
    }

    // 入力監視イベント
    janInput.addEventListener('input', () => {
        const value = janInput.value.trim();
        
        // 入力初期化時
        if (value === '') {
            clearBarcode();
            return;
        }

        // 数字以外の文字を除外
        if (!/^\d+$/.test(value)) {
            showError('半角数字のみ入力してください。');
            return;
        }

        let fullCode = value;

        // 12桁入力時: 13桁目のチェックデジットを自動計算
        if (value.length === 12) {
            const cd = calculateCheckDigit(value);
            fullCode = value + cd;
            showInfo(`12桁検知: チェックデジット <strong>[${cd}]</strong> を自動補完しました`);
            generateBarcode(fullCode);
        }
        // 7桁入力時: 8桁目のチェックデジットを自動計算
        else if (value.length === 7) {
            const cd = calculateCheckDigit(value);
            fullCode = value + cd;
            showInfo(`7桁検知: チェックデジット <strong>[${cd}]</strong> を自動補完しました`);
            generateBarcode(fullCode);
        }
        // 13桁または8桁のフル指定時
        else if (value.length === 13 || value.length === 8) {
            hideInfo();
            generateBarcode(fullCode);
        } 
        else {
            showError(`桁数を入力してください（7, 8, 12, 13桁に対応）`);
            hideDownloadButton();
            hideInfo();
            barcodeSvg.innerHTML = '';
        }
    });

    // バーコード生成処理
    function generateBarcode(code) {
        try {
            JsBarcode("#barcode", code, {
                format: "EAN13", // 8桁(EAN8)・13桁(EAN13)共に対応
                width: 2,
                height: 80,
                displayValue: true,
                fontSize: 18,
                margin: 10
            });
            
            currentFullCode = code;
            hideError();
            downloadBtn.style.display = 'block';
        } catch (e) {
            showError('無効なJANコードです（チェックデジットが一致しません）');
            hideDownloadButton();
        }
    }

    // 表示クリア・ユーティリティ関数群
    function clearBarcode() {
        barcodeSvg.innerHTML = '';
        hideError();
        hideInfo();
        hideDownloadButton();
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
    }

    function hideError() {
        errorMessage.style.display = 'none';
    }

    function showInfo(msg) {
        infoBox.innerHTML = msg;
        infoBox.style.display = 'block';
    }

    function hideInfo() {
        infoBox.style.display = 'none';
    }

    function hideDownloadButton() {
        downloadBtn.style.display = 'none';
    }

    // PNG画像としてダウンロード
    downloadBtn.addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(barcodeSvg);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const image = new Image();
        image.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            const context = canvas.getContext('2d');
            
            context.fillStyle = '#FFFFFF';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0);

            const png = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = png;
            downloadLink.download = `JAN_${currentFullCode}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        };
        image.src = blobURL;
    });
</script>

</body>
</html>
